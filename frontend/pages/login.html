<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2d8659">
    <title>تسجيل الدخول - المصليات الجامعية</title>
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="../assets/css/auth.css">
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-logo">
                <h1>🕌 المصليات الجامعية</h1>
                <p>مرحباً بعودتك</p>
            </div>

            <div id="error-message" class="alert alert-danger hidden" role="alert"></div>

            <form id="login-form" novalidate>
                <div class="form-group">
                    <label class="form-label" for="email">البريد الإلكتروني</label>
                    <input class="form-input" type="email" id="email" name="email" autocomplete="email" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">كلمة المرور</label>
                    <input class="form-input" type="password" id="password" name="password" autocomplete="current-password" required>
                </div>

                <button type="submit" class="btn btn-primary">تسجيل الدخول</button>
            </form>

            <div class="auth-links">
                ليس لديك حساب؟ <a href="register.html">إنشاء حساب جديد</a>
            </div>
        </div>
    </div>

    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/auth-pages.js"></script>
</body>
</html>
