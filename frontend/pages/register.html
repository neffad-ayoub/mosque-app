<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2d8659">
    <title>إنشاء حساب - المصليات الجامعية</title>
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="../assets/css/auth.css">
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-logo">
                <h1>🕌 المصليات الجامعية</h1>
                <p>إنشاء حساب جديد</p>
            </div>

            <div id="error-message" class="alert alert-danger hidden" role="alert"></div>

            <form id="register-form" novalidate>
                <div class="form-group">
                    <label class="form-label" for="name">الاسم الكامل</label>
                    <input class="form-input" type="text" id="name" name="name" autocomplete="name" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="email">البريد الإلكتروني</label>
                    <input class="form-input" type="email" id="email" name="email" autocomplete="email" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="phone">رقم الهاتف (اختياري)</label>
                    <input class="form-input" type="tel" id="phone" name="phone" autocomplete="tel">
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">كلمة المرور (8 أحرف على الأقل)</label>
                    <input class="form-input" type="password" id="password" name="password" autocomplete="new-password" minlength="8" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="confirmPassword">تأكيد كلمة المرور</label>
                    <input class="form-input" type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password" required>
                </div>

                <button type="submit" class="btn btn-primary">إنشاء الحساب</button>
            </form>

            <div class="auth-links">
                لديك حساب بالفعل؟ <a href="login.html">تسجيل الدخول</a>
            </div>
        </div>
    </div>

    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/auth-pages.js"></script>
</body>
</html>
